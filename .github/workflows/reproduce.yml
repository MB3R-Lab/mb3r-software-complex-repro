name: Reproduce software-complex results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-reproduction:
    name: Verify locked source toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4
        with:
          path: reproduction

      - name: Read toolchain lock
        id: lock
        working-directory: reproduction
        shell: bash
        run: |
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Check out Procrustes
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Procrustes
          ref: ${{ steps.lock.outputs.procrustes_commit }}
          path: toolchain/Procrustes

      - name: Check out Bering
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Bering
          ref: ${{ steps.lock.outputs.bering_commit }}
          path: toolchain/Bering

      - name: Check out Sheaft
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Sheaft
          ref: ${{ steps.lock.outputs.sheaft_commit }}
          path: toolchain/Sheaft

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache-dependency-path: |
            toolchain/Procrustes/go.sum
            toolchain/Bering/go.sum
            toolchain/Sheaft/go.sum

      - name: Reproduce and verify references
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper

      - name: Test the artifact runner and response-trace linkage
        working-directory: reproduction
        run: go test ./...

      - name: Verify expected-failure walkthroughs
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper-failures

      - name: Verify Birnbaum criticality walkthrough
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper-criticality

      - name: Verify extended evaluation scenarios
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper-evaluation BENCHMARK_REPEATS=1

      - name: Replay the observed operation and compare both candidates
        id: operation_replay
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper-operation

      - name: Diagnose a newly observed database's effect on operation replay
        if: failure() && steps.operation_replay.outcome == 'failure'
        working-directory: reproduction
        env:
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          (cd "$SHEAFT_REPO" && go build -o "$RUNNER_TEMP/sheaft-diagnostic" ./cmd/sheaft)
          python3 scripts/diagnose_operation_draw_order.py \
            --work .tmp/paper-reproduction/work/operation-walkthrough \
            --reference reference/operation \
            --sheaft "$RUNNER_TEMP/sheaft-diagnostic"

      - name: Upload generated outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: software-complex-reproduction-${{ github.sha }}
          path: reproduction/.tmp/paper-reproduction/work
          if-no-files-found: warn
          retention-days: 3

  container-smoke:
    name: Verify reviewer container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4

      - name: Read toolchain lock
        id: lock
        shell: bash
        run: |
          echo "release_version=$(jq -r '.toolchain.version' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local reviewer image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mb3r-software-complex-repro:test
          build-args: |
            RELEASE_VERSION=${{ steps.lock.outputs.release_version }}
            IMAGE_REVISION=${{ github.sha }}
            PROCRUSTES_COMMIT=${{ steps.lock.outputs.procrustes_commit }}
            BERING_COMMIT=${{ steps.lock.outputs.bering_commit }}
            SHEAFT_COMMIT=${{ steps.lock.outputs.sheaft_commit }}
          cache-from: type=gha,scope=reviewer-container
          cache-to: type=gha,mode=max,scope=reviewer-container

      - name: Run default reviewer demonstration
        run: docker run --rm mb3r-software-complex-repro:test

      - name: Run alternate packaged case
        run: docker run --rm mb3r-software-complex-repro:test --case otel-demo-async --repeat 1

      - name: Run packaged Birnbaum criticality walkthrough
        run: docker run --rm mb3r-software-complex-repro:test --criticality-walkthrough

      - name: Run packaged expected-failure walkthroughs
        run: docker run --rm mb3r-software-complex-repro:test --failure-walkthroughs

      - name: Run packaged extended evaluation scenarios
        run: docker run --rm mb3r-software-complex-repro:test --evaluation-suite --benchmark-repeats 1

  publish-container:
    name: Publish versioned reviewer container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-reproduction, container-smoke]
    concurrency:
      group: reviewer-versioned-image-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.guard.outputs.digest || steps.publish.outputs.digest }}
      published: ${{ steps.guard.outputs.exists == 'false' }}
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4

      - name: Read toolchain lock
        id: lock
        shell: bash
        run: |
          echo "release_version=$(jq -r '.toolchain.version' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Preserve an existing versioned image
        id: guard
        env:
          RELEASE_VERSION: ${{ steps.lock.outputs.release_version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = 'mb3r-lab/mb3r-software-complex-repro'
          version = os.environ['RELEASE_VERSION']
          token_url = ('https://ghcr.io/token?service=ghcr.io&scope=' +
                       quote(f'repository:{repository}:pull', safe=''))
          with urlopen(token_url, timeout=20) as response:
              token = json.load(response)['token']
          request = Request(
              f'https://ghcr.io/v2/{repository}/manifests/v{version}',
              method='HEAD',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': ('application/vnd.oci.image.index.v1+json, '
                             'application/vnd.docker.distribution.manifest.list.v2+json'),
              },
          )
          try:
              with urlopen(request, timeout=20) as response:
                  digest = response.headers.get('Docker-Content-Digest', '')
                  if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                      raise RuntimeError('existing image has no valid immutable digest')
                  exists = True
          except HTTPError as error:
              if error.code != 404:
                  raise  # Auth, rate-limit and registry failures cannot permit overwrite.
              exists, digest = False, ''
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"exists={str(exists).lower()}\ndigest={digest}\n")
          print(f"Versioned image {'already exists; retaining' if exists else 'absent; publishing'}: v{version} {digest}")
          PY

      - name: Set up QEMU
        if: steps.guard.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.guard.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.guard.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        if: steps.guard.outputs.exists == 'false'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mb3r-lab/mb3r-software-complex-repro:v${{ steps.lock.outputs.release_version }}
            ghcr.io/mb3r-lab/mb3r-software-complex-repro:latest
          build-args: |
            RELEASE_VERSION=${{ steps.lock.outputs.release_version }}
            IMAGE_REVISION=${{ github.sha }}
            PROCRUSTES_COMMIT=${{ steps.lock.outputs.procrustes_commit }}
            BERING_COMMIT=${{ steps.lock.outputs.bering_commit }}
            SHEAFT_COMMIT=${{ steps.lock.outputs.sheaft_commit }}
          cache-from: type=gha,scope=reviewer-container
          cache-to: type=gha,mode=max,scope=reviewer-container
          provenance: mode=max
          sbom: true

      - name: Record published digest
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: echo "Published digest \`${{ steps.publish.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Record retained digest
        if: steps.guard.outputs.exists == 'true'
        shell: bash
        run: echo "Retained existing versioned digest \`${{ steps.guard.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  public-pull-smoke:
    name: Download and run the public released image without registry login
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish-container.outputs.published == 'true'
    needs: publish-container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Pull the published immutable digest anonymously
        run: docker pull ghcr.io/mb3r-lab/mb3r-software-complex-repro@${{ needs.publish-container.outputs.digest }}
      - name: Replay the reviewer Compose command and verify persisted output
        run: |
          docker compose run --rm demo
          test -s output/operation-walkthrough/result.json
          test -s output/operation-walkthrough/summary.md
          version=$(jq -r .toolchain.version toolchain-lock.json)
          image="ghcr.io/mb3r-lab/mb3r-software-complex-repro:v$version"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$version"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.mb3r.toolchain.version" }}')" = "$version"
          test "$(docker image inspect "$image" --format '{{ index .RepoDigests 0 }}')" = "ghcr.io/mb3r-lab/mb3r-software-complex-repro@${{ needs.publish-container.outputs.digest }}"
