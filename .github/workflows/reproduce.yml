name: Reproduce software-complex results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-reproduction:
    name: Verify locked source toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4
        with:
          path: reproduction

      - name: Read toolchain lock
        id: lock
        working-directory: reproduction
        shell: bash
        run: |
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Check out Procrustes
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Procrustes
          ref: ${{ steps.lock.outputs.procrustes_commit }}
          path: toolchain/Procrustes

      - name: Check out Bering
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Bering
          ref: ${{ steps.lock.outputs.bering_commit }}
          path: toolchain/Bering

      - name: Check out Sheaft
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Sheaft
          ref: ${{ steps.lock.outputs.sheaft_commit }}
          path: toolchain/Sheaft

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache-dependency-path: |
            toolchain/Procrustes/go.sum
            toolchain/Bering/go.sum
            toolchain/Sheaft/go.sum

      - name: Reproduce and verify references
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-complex-reproduction-${{ github.sha }}
          path: reproduction/.tmp/paper-reproduction/work
          if-no-files-found: warn
          retention-days: 14

  container-smoke:
    name: Verify reviewer container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4

      - name: Read toolchain lock
        id: lock
        shell: bash
        run: |
          echo "toolchain_version=$(jq -r '.toolchain.version' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local reviewer image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mb3r-software-complex-repro:test
          build-args: |
            TOOLCHAIN_VERSION=${{ steps.lock.outputs.toolchain_version }}
            IMAGE_REVISION=${{ github.sha }}
            PROCRUSTES_COMMIT=${{ steps.lock.outputs.procrustes_commit }}
            BERING_COMMIT=${{ steps.lock.outputs.bering_commit }}
            SHEAFT_COMMIT=${{ steps.lock.outputs.sheaft_commit }}
          cache-from: type=gha,scope=reviewer-container
          cache-to: type=gha,mode=max,scope=reviewer-container

      - name: Run default reviewer demonstration
        run: docker run --rm mb3r-software-complex-repro:test

      - name: Run alternate packaged case
        run: docker run --rm mb3r-software-complex-repro:test --case otel-demo-async --repeat 1

  publish-container:
    name: Publish versioned reviewer container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-reproduction, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4

      - name: Read toolchain lock
        id: lock
        shell: bash
        run: |
          echo "toolchain_version=$(jq -r '.toolchain.version' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mb3r-lab/mb3r-software-complex-repro:toolchain-${{ steps.lock.outputs.toolchain_version }}
            ghcr.io/mb3r-lab/mb3r-software-complex-repro:latest
          build-args: |
            TOOLCHAIN_VERSION=${{ steps.lock.outputs.toolchain_version }}
            IMAGE_REVISION=${{ github.sha }}
            PROCRUSTES_COMMIT=${{ steps.lock.outputs.procrustes_commit }}
            BERING_COMMIT=${{ steps.lock.outputs.bering_commit }}
            SHEAFT_COMMIT=${{ steps.lock.outputs.sheaft_commit }}
          cache-from: type=gha,scope=reviewer-container
          cache-to: type=gha,mode=max,scope=reviewer-container
          provenance: mode=max
          sbom: true

      - name: Record published digest
        shell: bash
        run: echo "Published digest \`${{ steps.publish.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
