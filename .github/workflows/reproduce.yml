name: Reproduce software-complex results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-reproduction:
    name: Verify locked source toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4
        with:
          path: reproduction

      - name: Read toolchain lock
        id: lock
        working-directory: reproduction
        shell: bash
        run: |
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Check out Procrustes
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Procrustes
          ref: ${{ steps.lock.outputs.procrustes_commit }}
          path: toolchain/Procrustes

      - name: Check out Bering
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Bering
          ref: ${{ steps.lock.outputs.bering_commit }}
          path: toolchain/Bering

      - name: Check out Sheaft
        uses: actions/checkout@v4
        with:
          repository: MB3R-Lab/Sheaft
          ref: ${{ steps.lock.outputs.sheaft_commit }}
          path: toolchain/Sheaft

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache-dependency-path: |
            toolchain/Procrustes/go.sum
            toolchain/Bering/go.sum
            toolchain/Sheaft/go.sum

      - name: Reproduce and verify references
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper

      - name: Test the artifact runner and response-trace linkage
        working-directory: reproduction
        run: go test ./...

      - name: Verify expected-failure walkthroughs
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper-failures

      - name: Verify Birnbaum criticality walkthrough
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper-criticality

      - name: Verify extended evaluation scenarios
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper-evaluation BENCHMARK_REPEATS=1

      - name: Replay the observed operation and compare both candidates
        working-directory: reproduction
        env:
          PROCRUSTES_REPO: ${{ github.workspace }}/toolchain/Procrustes
          BERING_REPO: ${{ github.workspace }}/toolchain/Bering
          SHEAFT_REPO: ${{ github.workspace }}/toolchain/Sheaft
        run: make reproduce-paper-operation

      - name: Upload generated outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: software-complex-reproduction-${{ github.sha }}
          path: reproduction/.tmp/paper-reproduction/work
          if-no-files-found: warn
          retention-days: 3

  container-smoke:
    name: Verify reviewer container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4

      - name: Read toolchain lock
        id: lock
        shell: bash
        run: |
          echo "toolchain_version=$(jq -r '.toolchain.version' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$(jq -r '.artifact.version' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local reviewer image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mb3r-software-complex-repro:test
          build-args: |
            TOOLCHAIN_VERSION=${{ steps.lock.outputs.toolchain_version }}
            ARTIFACT_VERSION=${{ steps.lock.outputs.artifact_version }}
            IMAGE_REVISION=${{ github.sha }}
            PROCRUSTES_COMMIT=${{ steps.lock.outputs.procrustes_commit }}
            BERING_COMMIT=${{ steps.lock.outputs.bering_commit }}
            SHEAFT_COMMIT=${{ steps.lock.outputs.sheaft_commit }}
          cache-from: type=gha,scope=reviewer-container
          cache-to: type=gha,mode=max,scope=reviewer-container

      - name: Run default reviewer demonstration
        run: docker run --rm mb3r-software-complex-repro:test

      - name: Run alternate packaged case
        run: docker run --rm mb3r-software-complex-repro:test --case otel-demo-async --repeat 1

      - name: Run packaged Birnbaum criticality walkthrough
        run: docker run --rm mb3r-software-complex-repro:test --criticality-walkthrough

      - name: Run packaged expected-failure walkthroughs
        run: docker run --rm mb3r-software-complex-repro:test --failure-walkthroughs

      - name: Run packaged extended evaluation scenarios
        run: docker run --rm mb3r-software-complex-repro:test --evaluation-suite --benchmark-repeats 1

  publish-container:
    name: Publish versioned reviewer container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-reproduction, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4

      - name: Read toolchain lock
        id: lock
        shell: bash
        run: |
          echo "toolchain_version=$(jq -r '.toolchain.version' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$(jq -r '.artifact.version' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "procrustes_commit=$(jq -r '.components.procrustes.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "bering_commit=$(jq -r '.components.bering.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"
          echo "sheaft_commit=$(jq -r '.components.sheaft.source.commit' toolchain-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mb3r-lab/mb3r-software-complex-repro:artifact-${{ steps.lock.outputs.artifact_version }}
            ghcr.io/mb3r-lab/mb3r-software-complex-repro:latest
          build-args: |
            TOOLCHAIN_VERSION=${{ steps.lock.outputs.toolchain_version }}
            ARTIFACT_VERSION=${{ steps.lock.outputs.artifact_version }}
            IMAGE_REVISION=${{ github.sha }}
            PROCRUSTES_COMMIT=${{ steps.lock.outputs.procrustes_commit }}
            BERING_COMMIT=${{ steps.lock.outputs.bering_commit }}
            SHEAFT_COMMIT=${{ steps.lock.outputs.sheaft_commit }}
          cache-from: type=gha,scope=reviewer-container
          cache-to: type=gha,mode=max,scope=reviewer-container
          provenance: mode=max
          sbom: true

      - name: Record published digest
        shell: bash
        run: echo "Published digest \`${{ steps.publish.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  public-pull-smoke:
    name: Download and run the public released image without registry login
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Pull the published immutable digest anonymously
        run: docker pull ghcr.io/mb3r-lab/mb3r-software-complex-repro@${{ needs.publish-container.outputs.digest }}
      - name: Replay the reviewer Compose command and verify persisted output
        run: |
          docker compose run --rm demo
          test -s output/operation-walkthrough/result.json
          test -s output/operation-walkthrough/summary.md
          version=$(jq -r .artifact.version toolchain-lock.json)
          image="ghcr.io/mb3r-lab/mb3r-software-complex-repro:artifact-$version"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
