name: procrustes-static-context-8c2dcf0af880
services:
    - id: checkout
      replicas: 1
      attributes:
        procrustes.container: checkout
        procrustes.image: ghcr.io/open-telemetry/demo:2.0.2-checkout
        procrustes.service_version: 2.0.2-checkout
        procrustes.workload: default/Deployment/checkout
    - id: frontend
      replicas: 1
      attributes:
        procrustes.container: frontend
        procrustes.image: ghcr.io/open-telemetry/demo:2.0.2-frontend
        procrustes.service_version: 2.0.2-frontend
        procrustes.workload: default/Deployment/frontend
endpoints:
    - id: frontend:POST /api/checkout
      entry_service: frontend
      method: POST
      path: /api/checkout
      semantics:
        predicate_mode: immediate_response
        mandatory_targets:
            - checkout
        dependency_modes:
            - sync
        source: procrustes
