services:
  demo:
    image: ghcr.io/mb3r-lab/mb3r-software-complex-repro:toolchain-1.3.0
    pull_policy: always
  failures:
    image: ghcr.io/mb3r-lab/mb3r-software-complex-repro:toolchain-1.3.0
    pull_policy: always
    command: ["--failure-walkthroughs"]
  reproduce:
    image: ghcr.io/mb3r-lab/mb3r-software-complex-repro:toolchain-1.3.0
    pull_policy: always
    command: ["--repeat", "2"]
