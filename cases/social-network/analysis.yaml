schema_version: "1.2"
seed: 16
trials: 300000
endpoint_weights:
  home-timeline: 0.6
  user-timeline: 0.3
  compose-post: 0.1
profiles:
  - {name: p10, sampling_mode: fixed_k_replica_slots, failure_probability: 0.10}
  - {name: p30, sampling_mode: fixed_k_replica_slots, failure_probability: 0.30}
  - {name: p50, sampling_mode: fixed_k_replica_slots, failure_probability: 0.50}
  - {name: p70, sampling_mode: fixed_k_replica_slots, failure_probability: 0.70}
  - {name: p90, sampling_mode: fixed_k_replica_slots, failure_probability: 0.90}
gate:
  mode: report
  default_action: report
  global_threshold: 0.0
