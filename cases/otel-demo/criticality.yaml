schema_version: "1.3"
seed: 2607
trials: 12000
profiles:
  - name: importance-baseline
    sampling_mode: independent_replica
    failure_probability: 0.10
importance:
  - name: published-endpoint-criticality
    profile: importance-baseline
    method: birnbaum
    targets:
      - endpoint_id: "frontend:GET /api/cart"
      - endpoint_id: "frontend:GET /api/products"
      - endpoint_id: "frontend:GET /api/recommendations"
      - endpoint_id: "frontend:POST /api/checkout"
    components:
      kinds: [service, edge]
    confidence_level: 0.95
gate:
  mode: report
  default_action: report
  global_threshold: 0.01
