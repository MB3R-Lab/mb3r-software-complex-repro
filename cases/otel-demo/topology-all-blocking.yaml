source:
  type: topology_api
  ref: archive://otel-demo/trace-graph/all-blocking-paper
services:
  - {id: accounting, replicas: 1}
  - {id: ad, replicas: 1}
  - {id: cart, replicas: 1}
  - {id: checkout, replicas: 1}
  - {id: currency, replicas: 1}
  - {id: email, replicas: 1}
  - {id: flagd, replicas: 1}
  - {id: fraud-detection, replicas: 1}
  - {id: frontend, replicas: 1, failure_eligible: false}
  - {id: kafka, replicas: 1}
  - {id: payment, replicas: 1}
  - {id: product-catalog, replicas: 1}
  - {id: product-reviews, replicas: 1}
  - {id: quote, replicas: 1}
  - {id: recommendation, replicas: 1}
  - {id: shipping, replicas: 1}
edges:
  - {from: ad, to: flagd, kind: sync, blocking: true}
  - {from: cart, to: flagd, kind: sync, blocking: true}
  - {from: checkout, to: cart, kind: sync, blocking: true}
  - {from: checkout, to: currency, kind: sync, blocking: true}
  - {from: checkout, to: email, kind: sync, blocking: true}
  - {from: checkout, to: kafka, kind: sync, blocking: true}
  - {from: checkout, to: payment, kind: sync, blocking: true}
  - {from: checkout, to: product-catalog, kind: sync, blocking: true}
  - {from: checkout, to: shipping, kind: sync, blocking: true}
  - {from: fraud-detection, to: flagd, kind: sync, blocking: true}
  - {from: frontend, to: ad, kind: sync, blocking: true}
  - {from: frontend, to: cart, kind: sync, blocking: true}
  - {from: frontend, to: checkout, kind: sync, blocking: true, identity: {protocol: http, operation: POST, route: /api/checkout}}
  - {from: frontend, to: product-catalog, kind: sync, blocking: true}
  - {from: frontend, to: product-reviews, kind: sync, blocking: true}
  - {from: frontend, to: recommendation, kind: sync, blocking: true}
  - {from: kafka, to: accounting, kind: sync, blocking: true}
  - {from: kafka, to: fraud-detection, kind: sync, blocking: true}
  - {from: payment, to: flagd, kind: sync, blocking: true}
  - {from: product-reviews, to: flagd, kind: sync, blocking: true}
  - {from: recommendation, to: flagd, kind: sync, blocking: true}
  - {from: recommendation, to: product-catalog, kind: sync, blocking: true}
  - {from: shipping, to: quote, kind: sync, blocking: true}
endpoints:
  - id: "frontend:GET /api/products"
    entry_service: frontend
    method: GET
    path: /api/products
    predicate_ref: otel-demo.products
    semantics:
      predicate_mode: immediate_response
      mandatory_targets: [product-catalog]
      dependency_modes: [sync]
      source: archived-endpoint-targets
      confidence: 1.0
    weight: 0.25
  - id: "frontend:GET /api/recommendations"
    entry_service: frontend
    method: GET
    path: /api/recommendations
    predicate_ref: otel-demo.recommendations
    semantics:
      predicate_mode: immediate_response
      mandatory_targets: [recommendation]
      dependency_modes: [sync]
      source: archived-endpoint-targets
      confidence: 1.0
    weight: 0.25
  - id: "frontend:GET /api/cart"
    entry_service: frontend
    method: GET
    path: /api/cart
    predicate_ref: otel-demo.cart
    semantics:
      predicate_mode: immediate_response
      mandatory_targets: [cart]
      dependency_modes: [sync]
      source: archived-endpoint-targets
      confidence: 1.0
    weight: 0.25
  - id: "frontend:POST /api/checkout"
    entry_service: frontend
    method: POST
    path: /api/checkout
    predicate_ref: otel-demo.checkout.immediate
    semantics:
      predicate_mode: immediate_response
      mandatory_targets: [checkout, cart, payment, shipping]
      dependency_modes: [sync]
      source: archived-endpoint-targets
      confidence: 1.0
    weight: 0.25
