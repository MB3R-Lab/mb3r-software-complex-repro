schema_version: "1.3"
seed: 2701
trials: 20000
profiles:
  - name: release-candidate
    sampling_mode: independent_replica
    reliability:
      edge_live_probability: 0.995
sweeps:
  - name: recommendations-failure-tolerance
    profile: release-candidate
    confidence_level: 0.95
    axis:
      type: independent_replica_failure_probability
      values: [0.00, 0.02, 0.04, 0.05, 0.10, 0.15, 0.20, 0.25]
    targets:
      - endpoint_id: "frontend:GET /api/recommendations"
        slo: 0.95
gate:
  mode: fail
  default_action: fail
  global_threshold: 0.0
  endpoint_thresholds:
    "frontend:GET /api/cart": 0.0
    "frontend:GET /api/products": 0.0
    "frontend:GET /api/recommendations": 0.95
    "frontend:POST /api/checkout": 0.0
  boundary_rules:
    - sweep: recommendations-failure-tolerance
      endpoint_id: "frontend:GET /api/recommendations"
      minimum_certified_tolerance: 0.10
