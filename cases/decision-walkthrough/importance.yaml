schema_version: "1.3"
seed: 2701
trials: 12000
profiles:
  - name: candidate-state
    sampling_mode: independent_replica
    failure_probability: 0.10
    reliability:
      edge_live_probability: 0.995
importance:
  - name: recommendations-remediation-candidates
    profile: candidate-state
    method: birnbaum
    targets:
      - endpoint_id: "frontend:GET /api/recommendations"
    components:
      kinds: [service, edge]
    confidence_level: 0.95
gate:
  mode: report
  default_action: report
  global_threshold: 0.0
